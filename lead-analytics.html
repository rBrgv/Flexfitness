<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Fitness — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#f5f1e8; --paper:#0a0908; --panel:#17140f; --panel-raised:#1e1a13; --line:#2c2820;
    --accent:#e8a93d; --accent-dark:#c98b1f; --gold:#e8a93d; --muted:#a39c8c;
    --red:#e0645a; --blue:#6fa8dc; --green:#5fb98a; --green-dark:#3f8f68;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:1000px; margin:0 auto;}
  h1{font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 24px;}

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .brand svg{flex:none;}
  .brand-word{font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; font-size:15px;}
  .brand-word .gold{color:var(--accent);}

  .login-card{
    max-width:360px; margin:80px auto; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:28px 24px; text-align:center;
  }
  .login-card .brand{justify-content:center; margin-bottom:14px;}
  .login-card input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; margin:16px 0; font-family:inherit; background:var(--panel-raised); color:var(--ink);
  }
  .login-card button, .btn{
    width:100%; background:var(--accent); color:var(--paper); border:none; border-radius:10px;
    padding:13px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .error-text{color:var(--red); font-size:13px; margin-top:8px; display:none;}

  .stats-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; min-width:96px;}
  .stat b{display:block; font-size:22px; color:var(--accent);}
  .stat.escalated b{color:var(--red);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .filter-chip{
    border:1.5px solid var(--line); background:var(--panel); border-radius:20px;
    padding:7px 14px; font-size:13px; cursor:pointer; color:var(--muted);
  }
  .filter-chip.active{border-color:var(--accent); background:rgba(232,169,61,0.12); color:var(--accent); font-weight:700;}

  .lead-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden;
  }
  .lead-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; cursor:pointer;
  }
  .lead-row:hover{background:var(--panel-raised);}
  .lead-main{display:flex; align-items:center; gap:10px; min-width:0;}
  .lead-name{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lead-phone{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .status-pill{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:capitalize;
    white-space:nowrap;
  }
  .status-new{background:rgba(111,168,220,0.15); color:var(--blue);}
  .status-contacted{background:rgba(232,169,61,0.15); color:var(--gold);}
  .status-trial_booked{background:rgba(95,185,138,0.15); color:var(--green);}
  .status-converted{background:var(--green-dark); color:var(--ink);}
  .status-lost{background:var(--panel-raised); color:var(--muted);}
  .lead-meta{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--muted); flex-shrink:0;}
  .escalated-badge{color:var(--red); font-weight:700;}
  .chevron{transition:transform 0.15s; color:var(--muted); font-size:12px;}
  .lead-card.open .chevron{transform:rotate(90deg);}

  .thread{display:none; border-top:1px solid var(--line); padding:14px 18px; background:var(--panel-raised);}
  .lead-card.open .thread{display:block;}
  .msg{max-width:75%; margin-bottom:8px; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.4;}
  .msg.inbound{background:var(--panel); border:1px solid var(--line); margin-right:auto;}
  .msg.outbound{background:#005c4b; color:#e9edef; margin-left:auto;}
  .msg.escalated{border:1.5px solid var(--red);}
  .msg-time{font-size:10px; opacity:0.65; margin-top:3px;}
  .no-thread{font-size:12px; color:var(--muted); font-style:italic;}

  .actions{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .actions select{
    padding:7px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:12px; font-family:inherit; background:var(--panel-raised); color:var(--ink);
  }
  .actions .small-btn{
    background:var(--accent); color:var(--paper); border:none; border-radius:8px;
    padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .actions .small-btn.secondary{background:transparent; border:1.5px solid var(--accent); color:var(--accent);}
  .actions .small-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .member-note{font-size:12px; color:var(--green); font-weight:700;}
  .action-error{color:var(--red); font-size:12px; margin-top:6px; display:none;}

  .convert-form{
    display:none; margin-top:12px; padding:12px; background:var(--panel-raised);
    border:1px solid var(--line); border-radius:10px;
  }
  .convert-form.open{display:grid; gap:8px; grid-template-columns:1fr 1fr;}
  .convert-form label{font-size:11px; color:var(--muted); display:block; margin-bottom:3px;}
  .convert-form input, .convert-form select{
    width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13px; font-family:inherit; background:var(--panel); color:var(--ink);
  }
  .convert-form .full{grid-column:1 / -1;}

  .empty-state{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
  .loading{text-align:center; color:var(--muted); padding:40px; font-size:14px;}

  .tabs{
    display:flex; gap:18px; margin-bottom:20px; border-bottom:1px solid var(--line);
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    background:none; border:none; padding:10px 2px; font-size:14px; font-weight:700;
    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:inherit;
    white-space:nowrap; flex:none;
  }
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}

  .status-active{background:rgba(95,185,138,0.15); color:var(--green);}
  .status-expiring{background:rgba(232,169,61,0.15); color:var(--gold);}
  .status-expired{background:rgba(224,100,90,0.15); color:var(--red);}
  .status-frozen{background:rgba(111,168,220,0.15); color:var(--blue);}
  .status-cancelled{background:var(--panel-raised); color:var(--muted);}
  .expiry-badge{font-size:11px; font-weight:700; color:var(--muted);}
  .expiry-badge.urgent{color:var(--red);}
  .expiry-badge.soon{color:var(--gold);}

  .add-member-form{
    display:none; margin-bottom:16px; padding:14px; background:var(--panel-raised);
    border:1px solid var(--line); border-radius:12px;
  }
  .add-member-form.open{display:grid; gap:8px; grid-template-columns:1fr 1fr;}
  .add-member-form label{font-size:11px; color:var(--muted); display:block; margin-bottom:3px;}
  .add-member-form input, .add-member-form select{
    width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13px; font-family:inherit; background:var(--panel); color:var(--ink);
  }
  .add-member-form .full{grid-column:1 / -1;}
</style>
</head>
<body>

<div class="wrap" id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <path d="M4 6h9l3 6 3-6h9l-8 10 8 10h-9l-3-6-3 6H4l8-10Z" fill="none" stroke="#e8a93d" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
      <span class="brand-word">Flex <span class="gold">Fitness</span></span>
    </div>
    <h1 style="font-size:16px;">Analytics</h1>
    <p class="sub">Enter the password to view leads and conversations.</p>
    <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter') tryLogin()">
    <button onclick="tryLogin()">View analytics</button>
    <div class="error-text" id="loginError">Incorrect password — please try again.</div>
  </div>
</div>

<div class="wrap" id="dashScreen" style="display:none;">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
      <path d="M4 6h9l3 6 3-6h9l-8 10 8 10h-9l-3-6-3 6H4l8-10Z" fill="none" stroke="#e8a93d" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <span class="brand-word">Flex <span class="gold">Fitness</span></span>
  </div>
  <h1>Analytics</h1>
  <p class="sub">Leads from the WhatsApp bot, and members converted from them.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabLeadsBtn">Leads</button>
    <button class="tab-btn" id="tabMembersBtn">Members</button>
    <button class="tab-btn" id="tabTrainersBtn">Trainers</button>
    <button class="tab-btn" id="tabClassesBtn">Classes</button>
    <button class="tab-btn" id="tabBookingsBtn">Bookings</button>
  </div>

  <div id="leadsPanel">
    <div class="stats-row" id="statsRow"></div>
    <div class="filters" id="filterRow"></div>
    <div id="leadsList"><div class="loading">Loading leads…</div></div>
  </div>

  <div id="membersPanel" style="display:none;">
    <div class="stats-row" id="memberStatsRow"></div>
    <div class="filters" id="memberFilterRow"></div>
    <button class="small-btn" id="addMemberBtn" style="margin-bottom:14px; width:auto;">+ Add member</button>
    <div class="add-member-form" id="addMemberForm"></div>
    <div id="membersList"></div>
  </div>

  <div id="trainersPanel" style="display:none;">
    <div class="stats-row" id="trainerStatsRow"></div>
    <button class="small-btn" id="addTrainerBtn" style="margin-bottom:14px; width:auto;">+ Add trainer</button>
    <div class="add-member-form" id="addTrainerForm"></div>
    <div id="trainersList"></div>
  </div>

  <div id="classesPanel" style="display:none;">
    <div class="stats-row" id="classStatsRow"></div>
    <button class="small-btn" id="addClassBtn" style="margin-bottom:14px; width:auto;">+ Add class</button>
    <div class="add-member-form" id="addClassForm"></div>
    <div id="classesList"></div>
  </div>

  <div id="bookingsPanel" style="display:none;">
    <div class="stats-row" id="bookingStatsRow"></div>
    <button class="small-btn" id="addBookingBtn" style="margin-bottom:14px; width:auto;">+ Book a member into a class</button>
    <div class="add-member-form" id="addBookingForm"></div>
    <div id="bookingsList"></div>
  </div>

  <p style="text-align:center; color:var(--muted); font-size:12px; margin-top:28px;">Powered by CampaignWise</p>
</div>

<script>
const SUPABASE_URL = "https://tvdjrdsormftjzmghgtx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZGpyZHNvcm1mdGp6bWdoZ3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjU5NzQsImV4cCI6MjEwMDUwMTk3NH0.U_NayJkuHuvZPr--LJ3EzfvjPrd9ha-564DEhbuqkBE";

let supabaseClient = null;
let sessionPassword = null;
let analytics = { total_leads: 0, total_members: 0, by_status: {}, escalated_leads: 0, leads: [], members: [], trainers: [], classes: [], bookings: [], recent_messages: [] };
let activeFilter = 'all';
let openLeadId = null;
let convertOpenLeadId = null;
let activeTab = 'leads';
let memberFilter = 'all';
let openMemberId = null;
let renewOpenMemberId = null;
let addMemberFormOpen = false;
let addTrainerFormOpen = false;
let editTrainerId = null;
let addClassFormOpen = false;
let editClassId = null;
let addBookingFormOpen = false;
let bookingFilter = 'upcoming';

function tryLogin(){
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('loginError');

  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  supabaseClient.rpc('get_lead_analytics', { input_password: pw }).then(({ data, error }) => {
    if(error){
      errEl.textContent = "Incorrect password — please try again.";
      errEl.style.display = 'block';
      return;
    }
    sessionPassword = pw;
    analytics = data || analytics;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashScreen').style.display = 'block';
    switchTab('leads');
    renderDash();
  });
}

function switchTab(tab){
  activeTab = tab;
  document.getElementById('leadsPanel').style.display = tab === 'leads' ? 'block' : 'none';
  document.getElementById('membersPanel').style.display = tab === 'members' ? 'block' : 'none';
  document.getElementById('trainersPanel').style.display = tab === 'trainers' ? 'block' : 'none';
  document.getElementById('classesPanel').style.display = tab === 'classes' ? 'block' : 'none';
  document.getElementById('bookingsPanel').style.display = tab === 'bookings' ? 'block' : 'none';
  document.getElementById('tabLeadsBtn').className = 'tab-btn' + (tab === 'leads' ? ' active' : '');
  document.getElementById('tabMembersBtn').className = 'tab-btn' + (tab === 'members' ? ' active' : '');
  document.getElementById('tabTrainersBtn').className = 'tab-btn' + (tab === 'trainers' ? ' active' : '');
  document.getElementById('tabClassesBtn').className = 'tab-btn' + (tab === 'classes' ? ' active' : '');
  document.getElementById('tabBookingsBtn').className = 'tab-btn' + (tab === 'bookings' ? ' active' : '');
}
document.getElementById('tabLeadsBtn').onclick = () => switchTab('leads');
document.getElementById('tabMembersBtn').onclick = () => switchTab('members');
document.getElementById('tabTrainersBtn').onclick = () => switchTab('trainers');
document.getElementById('tabClassesBtn').onclick = () => switchTab('classes');
document.getElementById('tabBookingsBtn').onclick = () => switchTab('bookings');

function renderDash(){
  renderLeadsPanel();
  renderMembersPanel();
  renderTrainersPanel();
  renderClassesPanel();
  renderBookingsPanel();
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function formatTime(t){
  if(!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

function refreshAnalytics(){
  return supabaseClient.rpc('get_lead_analytics', { input_password: sessionPassword }).then(({ data, error }) => {
    if(error) return;
    analytics = data || analytics;
  });
}

const STATUS_LABELS = {
  new: 'New', contacted: 'Contacted', trial_booked: 'Trial booked',
  converted: 'Converted', lost: 'Lost'
};
const MEMBERSHIP_PLANS = ['Monthly', '3 Months', '6 Months', 'Yearly'];
const PLAN_MONTHS = { 'Monthly': 1, '3 Months': 3, '6 Months': 6, 'Yearly': 12 };

function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}

// Local calendar date as YYYY-MM-DD — NOT new Date().toISOString(), which
// silently returns yesterday's date during 12am-5:30am IST (India is
// UTC+5:30, so early-morning local time is still "yesterday" in UTC).
// Matters here since the gym opens at 5:30am and reception may be on this
// page right at that boundary.
function todayLocalDateString(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function renderLeadsPanel(){
  const statuses = Object.keys(STATUS_LABELS).filter(s => analytics.by_status[s]);

  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <div class="stat"><b>${analytics.total_leads}</b>Total leads</div>
    ${statuses.map(s => `<div class="stat"><b>${analytics.by_status[s]}</b>${STATUS_LABELS[s]}</div>`).join('')}
    <div class="stat"><b>${analytics.total_members || 0}</b>Members</div>
    <div class="stat escalated"><b>${analytics.escalated_leads}</b>Escalated</div>
  `;

  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'filter-chip' + (activeFilter === 'all' ? ' active' : '');
  allChip.textContent = `All (${analytics.total_leads})`;
  allChip.onclick = () => { activeFilter = 'all'; renderDash(); };
  filterRow.appendChild(allChip);

  statuses.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (activeFilter === s ? ' active' : '');
    chip.textContent = `${STATUS_LABELS[s]} (${analytics.by_status[s]})`;
    chip.onclick = () => { activeFilter = s; renderDash(); };
    filterRow.appendChild(chip);
  });

  const escChip = document.createElement('button');
  escChip.className = 'filter-chip' + (activeFilter === 'escalated' ? ' active' : '');
  escChip.textContent = `Escalated (${analytics.escalated_leads})`;
  escChip.onclick = () => { activeFilter = 'escalated'; renderDash(); };
  filterRow.appendChild(escChip);

  const leads = (analytics.leads || []).filter(l => {
    if(activeFilter === 'all') return true;
    if(activeFilter === 'escalated') return l.escalated_count > 0;
    return l.status === activeFilter;
  });

  const list = document.getElementById('leadsList');
  if(leads.length === 0){
    list.innerHTML = '<div class="empty-state">No leads yet for this filter.</div>';
    return;
  }

  list.innerHTML = '';
  leads.forEach(lead => {
    const card = document.createElement('div');
    card.className = 'lead-card' + (openLeadId === lead.id ? ' open' : '');

    const lastContact = new Date(lead.last_contact_at);
    const lastContactStr = lastContact.toLocaleDateString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

    const thread = (analytics.recent_messages || [])
      .filter(m => m.lead_id === lead.id)
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    let threadHtml = '<div class="no-thread">No messages in the last 200 logged — thread may be older.</div>';
    if(thread.length){
      threadHtml = thread.map(m => {
        const t = new Date(m.created_at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        return `<div class="msg ${m.direction}${m.escalated ? ' escalated' : ''}">${escapeHtml(m.body)}<div class="msg-time">${t}</div></div>`;
      }).join('');
    }

    const member = (analytics.members || []).find(m => m.lead_id === lead.id);
    let actionsHtml;
    if(member){
      const joined = new Date(member.joined_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
      actionsHtml = `<div class="actions"><span class="member-note">✓ Member since ${joined} — ${escapeHtml(member.membership_plan || '')}</span></div>`;
    } else {
      const statusOptions = Object.keys(STATUS_LABELS).filter(s => s !== 'converted');
      actionsHtml = `
        <div class="actions">
          <select class="status-select">
            ${statusOptions.map(s => `<option value="${s}" ${s === lead.status ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
          <button class="small-btn update-status-btn">Update status</button>
          <button class="small-btn secondary convert-btn">Convert to member →</button>
        </div>
        <div class="action-error"></div>
        <div class="convert-form${convertOpenLeadId === lead.id ? ' open' : ''}">
          <div class="full">
            <label>Member name</label>
            <input type="text" class="convert-name" value="${escapeHtml(lead.name || '')}" placeholder="Full name">
          </div>
          <div>
            <label>Plan</label>
            <select class="convert-plan">
              ${MEMBERSHIP_PLANS.map(p => `<option value="${p}">${p}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Start date</label>
            <input type="date" class="convert-start" value="${todayLocalDateString()}">
          </div>
          <div class="full">
            <button class="small-btn confirm-convert-btn">Confirm — create member</button>
          </div>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="lead-row">
        <div class="lead-main">
          <span class="lead-name">${escapeHtml(lead.name || 'Unnamed')}</span>
          <span class="lead-phone">${escapeHtml(lead.phone)}</span>
        </div>
        <div class="lead-meta">
          ${lead.escalated_count > 0 ? `<span class="escalated-badge">⚠ ${lead.escalated_count}</span>` : ''}
          <span class="status-pill status-${member ? 'converted' : lead.status}">${member ? 'Converted' : (STATUS_LABELS[lead.status] || lead.status)}</span>
          <span>${lastContactStr}</span>
          <span class="chevron">▶</span>
        </div>
      </div>
      <div class="thread">${threadHtml}${actionsHtml}</div>
    `;

    card.querySelector('.lead-row').onclick = () => {
      openLeadId = openLeadId === lead.id ? null : lead.id;
      renderDash();
    };

    const updateBtn = card.querySelector('.update-status-btn');
    if(updateBtn){
      updateBtn.onclick = (e) => {
        e.stopPropagation();
        const newStatus = card.querySelector('.status-select').value;
        updateBtn.disabled = true;

const MEMBER_STATUS_LABELS = {
  active: 'Active', expiring: 'Expiring Soon', expired: 'Expired',
  frozen: 'Frozen', cancelled: 'Cancelled'
};

// Both sides parsed identically (UTC noon) so the timezone offset cancels
// out cleanly — mixing new Date(dateOnlyString) (parses as UTC midnight)
// with new Date().toDateString() (parses as local midnight) would silently
// skew every comparison by the local UTC offset.
function daysBetweenDateStrings(fromStr, toStr){
  const from = new Date(fromStr + 'T12:00:00Z');
  const to = new Date(toStr + 'T12:00:00Z');
  return Math.round((to - from) / 86400000);
}

function memberDisplayStatus(m){
  if(m.status === 'frozen') return 'frozen';
  if(m.status === 'cancelled') return 'cancelled';
  if(!m.plan_end_date) return 'active';
  const daysLeft = daysBetweenDateStrings(todayLocalDateString(), m.plan_end_date);
  if(daysLeft < 0) return 'expired';
  if(daysLeft <= 7) return 'expiring';
  return 'active';
}

function daysLeftLabel(m){
  if(!m.plan_end_date) return 'No expiry set';
  const daysLeft = daysBetweenDateStrings(todayLocalDateString(), m.plan_end_date);
  if(daysLeft < 0) return `Expired ${Math.abs(daysLeft)}d ago`;
  if(daysLeft === 0) return 'Expires today';
  return `${daysLeft}d left`;
}

function setMemberStatus(memberId, newStatus){
  supabaseClient.rpc('update_member_status', {
    input_password: sessionPassword, member_id_input: memberId, new_status: newStatus
  }).then(({ error }) => {
    if(!error) refreshAnalytics().then(renderDash);
  });
}

        <div class="lead-main">
          <span class="lead-name">${escapeHtml(c.name)}</span>
          <span class="lead-phone">${DAY_NAMES[c.day_of_week]} · ${formatTime(c.start_time)}–${formatTime(c.end_time)}</span>
        </div>
        <div class="lead-meta">
          <span>${c.trainer_name ? escapeHtml(c.trainer_name) : 'Unassigned'} · cap ${c.capacity}</span>
          <span class="status-pill status-${c.active ? 'active' : 'cancelled'}">${c.active ? 'Active' : 'Inactive'}</span>
          <span class="chevron">▶</span>
        </div>
      </div>
      <div class="thread">${editHtml}</div>
    `;

    card.querySelector('.lead-row').onclick = () => {
      editClassId = editing ? null : c.id;
      renderClassesPanel();
    };

    card.querySelector('.save-class-btn').onclick = (e) => {
      e.stopPropagation();
      const name = card.querySelector('.edit-name').value.trim();
      const trainerId = card.querySelector('.edit-trainer').value || null;
      const day = parseInt(card.querySelector('.edit-day').value, 10);
      const start = card.querySelector('.edit-start').value;
      const end = card.querySelector('.edit-end').value;
      const capacity = parseInt(card.querySelector('.edit-capacity').value, 10);
      const errEl = card.querySelector('.action-error');
      if(!name || !start || !end || !capacity){
        errEl.textContent = 'All fields except trainer are required.';
        errEl.style.display = 'block';
        return;
      }
      const btn = card.querySelector('.save-class-btn');
      btn.disabled = true;
      supabaseClient.rpc('update_class', {
        input_password: sessionPassword, class_id_input: c.id, class_name: name,
        trainer_id_input: trainerId, day_of_week_input: day, start_time_input: start,
        end_time_input: end, capacity_input: capacity, class_active: c.active
      }).then(({ error }) => {
        if(error){
          errEl.textContent = error.message.includes('End time') ? error.message : 'Could not save — please try again.';
          errEl.style.display = 'block';
          btn.disabled = false;
          return;
        }
        editClassId = null;
        refreshAnalytics().then(renderDash);
      });
    };

    const toggleBtn = card.querySelector('[data-toggle]');
    toggleBtn.onclick = (e) => {
      e.stopPropagation();
      const wasActive = toggleBtn.dataset.toggle === 'true';
      toggleBtn.disabled = true;
      supabaseClient.rpc('update_class', {
        input_password: sessionPassword, class_id_input: c.id, class_name: c.name,
        trainer_id_input: c.trainer_id, day_of_week_input: c.day_of_week,
        start_time_input: c.start_time, end_time_input: c.end_time,
        capacity_input: c.capacity, class_active: !wasActive
      }).then(({ error }) => {
        if(!error){
          editClassId = null;
          refreshAnalytics().then(renderDash);
        }
      });
    };

    list.appendChild(card);
  });
}

function renderBookingsPanel(){
  const bookings = analytics.bookings || [];
  const today = todayLocalDateString();
  const todayCount = bookings.filter(b => b.class_date === today).length;

  document.getElementById('bookingStatsRow').innerHTML = `
    <div class="stat"><b>${bookings.length}</b>Upcoming (14d)</div>
    <div class="stat"><b>${todayCount}</b>Today</div>
  `;

  const activeMembers = (analytics.members || []).filter(m => m.status === 'active');
  const activeClasses = (analytics.classes || []).filter(c => c.active);

  document.getElementById('addBookingBtn').onclick = () => { addBookingFormOpen = !addBookingFormOpen; renderBookingsPanel(); };

  const formEl = document.getElementById('addBookingForm');
  formEl.className = 'add-member-form' + (addBookingFormOpen ? ' open' : '');
  formEl.innerHTML = `
    <div>
      <label>Member</label>
      <select id="bookMember">
        ${activeMembers.map(m => `<option value="${m.id}">${escapeHtml(m.name)} (${escapeHtml(m.phone)})</option>`).join('')}
      </select>
    </div>
    <div>
      <label>Class</label>
      <select id="bookClass">
        ${activeClasses.map(c => `<option value="${c.id}">${escapeHtml(c.name)} — ${DAY_NAMES[c.day_of_week]} ${formatTime(c.start_time)}</option>`).join('')}
      </select>
    </div>
    <div class="full"><label>Date</label><input type="date" id="bookDate" value="${today}"></div>
    <div class="full"><div class="action-error" id="addBookingError"></div><button class="small-btn" id="confirmBookBtn">Book</button></div>
  `;
  if(addBookingFormOpen){
    if(activeMembers.length === 0 || activeClasses.length === 0){
      formEl.innerHTML = `<div class="full" style="color:var(--muted); font-size:13px;">Need at least one active member and one active class to book.</div>`;
    } else {
      document.getElementById('confirmBookBtn').onclick = () => {
        const memberId = document.getElementById('bookMember').value;
        const classId = document.getElementById('bookClass').value;
        const date = document.getElementById('bookDate').value;
        const errEl = document.getElementById('addBookingError');
        const btn = document.getElementById('confirmBookBtn');
        btn.disabled = true;
        supabaseClient.rpc('admin_book_class', {
          input_password: sessionPassword, class_id_input: classId, member_id_input: memberId, class_date_input: date
        }).then(({ error }) => {
          if(error){
            errEl.textContent = error.message.includes('full') ? 'That class is full for that date.'
              : error.message.includes('duplicate') ? 'Already booked for that class and date.'
              : 'Could not book — please try again.';
            errEl.style.display = 'block';
            btn.disabled = false;
            return;
          }
          addBookingFormOpen = false;
          refreshAnalytics().then(renderDash);
        });
      };
    }
  }

  const list = document.getElementById('bookingsList');
  if(bookings.length === 0){
    list.innerHTML = '<div class="empty-state">No bookings in the next 14 days.</div>';
    return;
  }

  list.innerHTML = '';
  bookings.forEach(b => {
    const row = document.createElement('div');
    row.className = 'lead-card';
    const dateStr = new Date(b.class_date).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
    const isToday = b.class_date === today;

    row.innerHTML = `
      <div class="lead-row" style="cursor:default;">
        <div class="lead-main">
          <span class="lead-name">${escapeHtml(b.member_name)}</span>
          <span class="lead-phone">${escapeHtml(b.class_name)} · ${formatTime(b.start_time)}–${formatTime(b.end_time)}</span>
        </div>
        <div class="lead-meta">
          <span class="status-pill ${isToday ? 'status-expiring' : 'status-active'}">${dateStr}</span>
          <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); cursor:pointer;">
            <input type="checkbox" class="attended-check" ${b.attended ? 'checked' : ''}> Attended
          </label>
          <button class="small-btn cancel-booking-btn" style="background:var(--red);">Cancel</button>
        </div>
      </div>
    `;

    row.querySelector('.attended-check').onchange = (e) => {
      supabaseClient.rpc('mark_attendance', {
        input_password: sessionPassword, booking_id_input: b.id, attended_input: e.target.checked
      }).then(({ error }) => {
        if(error) refreshAnalytics().then(renderDash);
      });
    };

    row.querySelector('.cancel-booking-btn').onclick = () => {
      if(!confirm(`Cancel ${b.member_name}'s booking for ${b.class_name} on ${dateStr}?`)) return;
      supabaseClient.rpc('cancel_booking_admin', {
        input_password: sessionPassword, booking_id_input: b.id
      }).then(({ error }) => {
        if(!error) refreshAnalytics().then(renderDash);
      });
    };

    list.appendChild(row);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
