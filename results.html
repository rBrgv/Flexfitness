<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Fitness — Discovery Results</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#12181B; --paper:#FBF9F6; --panel:#FFFFFF; --line:#E4E0D8;
    --accent:#1F6F5C; --accent-dark:#134A3D; --gold:#C08A3E; --muted:#6B7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:820px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 24px;}

  .login-card{
    max-width:360px; margin:80px auto; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:28px 24px; text-align:center;
  }
  .login-card input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; margin:16px 0; font-family:inherit;
  }
  .login-card button, .btn{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:13px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .error-text{color:#B4491F; font-size:13px; margin-top:8px; display:none;}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .filter-chip{
    border:1.5px solid var(--line); background:#fff; border-radius:20px;
    padding:7px 14px; font-size:13px; cursor:pointer; color:var(--muted);
  }
  .filter-chip.active{border-color:var(--accent); background:#EAF3F0; color:var(--accent-dark); font-weight:700;}

  .stats-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px;}
  .stat b{display:block; font-size:20px; color:var(--accent-dark);}

  .response-card{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:18px; margin-bottom:14px;
  }
  .response-card .meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .role-pill{
    background:var(--accent); color:#fff; font-size:12px; font-weight:700;
    padding:4px 10px; border-radius:20px;
  }
  .timestamp{font-size:12px; color:var(--muted);}
  .qa{margin-bottom:10px; font-size:14px; line-height:1.5;}
  .qa .q{font-weight:700; color:var(--ink);}
  .qa .a{color:#374151; margin-top:2px;}
  .qa .a.skipped{color:var(--muted); font-style:italic;}

  .empty-state{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
  .loading{text-align:center; color:var(--muted); padding:40px; font-size:14px;}
</style>
</head>
<body>

<div class="wrap" id="loginScreen">
  <div class="login-card">
    <h1 style="font-size:18px;">Discovery Results</h1>
    <p class="sub">Enter the password to view submissions.</p>
    <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter') tryLogin()">
    <button onclick="tryLogin()">View results</button>
    <div class="error-text" id="loginError">Incorrect password — please try again.</div>
  </div>
</div>

<div class="wrap" id="resultsScreen" style="display:none;">
  <h1>Flex Fitness — Discovery Results</h1>
  <p class="sub">All submissions from the discovery form, most recent first.</p>

  <div class="stats-row" id="statsRow"></div>
  <div class="filters" id="filterRow"></div>
  <div id="resultsList"><div class="loading">Loading responses…</div></div>
</div>

<script>
// ============================================================
// SUPABASE CONFIG — same project as the discovery form
// ============================================================
const SUPABASE_URL = "https://tvdjrdsormftjzmghgtx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZGpyZHNvcm1mdGp6bWdoZ3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjU5NzQsImV4cCI6MjEwMDUwMTk3NH0.U_NayJkuHuvZPr--LJ3EzfvjPrd9ha-564DEhbuqkBE";

let supabaseClient = null;
let allResponses = [];
let activeFilter = 'all';

function tryLogin(){
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('loginError');

  if(SUPABASE_URL === "YOUR_SUPABASE_URL_HERE"){
    errEl.textContent = "Not connected yet — Supabase URL/key still need to be filled in.";
    errEl.style.display = 'block';
    return;
  }

  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  supabaseClient.rpc('get_discovery_responses', { input_password: pw }).then(({ data, error }) => {
    if(error){
      errEl.textContent = "Incorrect password — please try again.";
      errEl.style.display = 'block';
      return;
    }
    allResponses = data || [];
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('resultsScreen').style.display = 'block';
    renderResults();
  });
}

function renderResults(){
  const roles = [...new Set(allResponses.map(r => r.role_label))];
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = '';

  const allChip = document.createElement('button');
  allChip.className = 'filter-chip' + (activeFilter === 'all' ? ' active' : '');
  allChip.textContent = `All (${allResponses.length})`;
  allChip.onclick = () => { activeFilter = 'all'; renderResults(); };
  filterRow.appendChild(allChip);

  roles.forEach(role => {
    const count = allResponses.filter(r => r.role_label === role).length;
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (activeFilter === role ? ' active' : '');
    chip.textContent = `${role} (${count})`;
    chip.onclick = () => { activeFilter = role; renderResults(); };
    filterRow.appendChild(chip);
  });

  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <div class="stat"><b>${allResponses.length}</b>Total responses</div>
    <div class="stat"><b>${roles.length}</b>Roles represented</div>
  `;

  const filtered = activeFilter === 'all'
    ? allResponses
    : allResponses.filter(r => r.role_label === activeFilter);

  const list = document.getElementById('resultsList');
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-state">No responses yet for this filter.</div>';
    return;
  }

  list.innerHTML = '';
  filtered.forEach(resp => {
    const card = document.createElement('div');
    card.className = 'response-card';

    const date = new Date(resp.submitted_at);
    const dateStr = date.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

    let qaHtml = '';
    (resp.answers || []).forEach(qa => {
      const skipped = qa.answer === '(skipped)';
      qaHtml += `<div class="qa"><div class="q">${escapeHtml(qa.question)}</div><div class="a ${skipped ? 'skipped' : ''}">${escapeHtml(qa.answer)}</div></div>`;
    });

    card.innerHTML = `
      <div class="meta">
        <span class="role-pill">${escapeHtml(resp.role_label)}</span>
        <span class="timestamp">${dateStr}</span>
      </div>
      ${qaHtml}
    `;
    list.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
